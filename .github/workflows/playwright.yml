name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        APP_EMAIL: ${{ secrets.APP_EMAIL }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        FAKESTORE_USERNAME: ${{ secrets.FAKESTORE_USERNAME }}
        FAKESTORE_PASSWORD: ${{ secrets.FAKESTORE_PASSWORD }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        APP_ENV: ${{ vars.APP_ENV }}
        TEST_ENV: ${{ vars.TEST_ENV }}
        PRODUCT_NAME: ${{ vars.PRODUCT_NAME }}
        PRODUCT_QUANTITY: ${{ vars.PRODUCT_QUANTITY }}
        TOTAL_PRICE: ${{ vars.TOTAL_PRICE }}
        USER_ID: ${{ vars.USER_ID }}
        PRODUCT_ID: ${{ vars.PRODUCT_ID }}
        CART_ID: ${{ vars.CART_ID }}
        LIMIT: ${{ vars.LIMIT }}
        START_DATE: ${{ vars.START_DATE }}
        END_DATE: ${{ vars.END_DATE }}
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: reports/
        retention-days: 30
